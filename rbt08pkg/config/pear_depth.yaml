pear_surface_estimator:
  ros__parameters:
    mask_topic: /orchard/vision/target_mask
    depth_topic: /orchard/camera/depth/image_raw
    camera_info_topic: /orchard/camera/camera_info
    camera_frame: table_camera_link_optical
    queue_size: 20
    stream_timeout_s: 10.0
    erosion_size: 3
    sample_radius_px: 4
    min_valid_pixels: 10
    min_valid_fraction: 0.5
    min_depth_m: 0.1
    max_depth_m: 5.0
    max_depth_spread_m: 0.06
